<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · GRAPAL · FMUSP</title>
  <meta name="robots" content="noindex">
  <script>
    /* Esta página aparece em qualquer endereço inexistente. Para a marca e os links funcionarem com o site
       numa pasta (lens.fm.usp.br/grapal/) ou na raiz de um domínio, o endereço-base é definido aqui. */
    (function () {
      var b = document.createElement('base');
      b.href = location.pathname.indexOf('/grapal/') === 0 ? '/grapal/' : '/';
      document.head.appendChild(b);
    })();
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    /* Mesma capa do início: a marca no eixo do cruzamento dos dois triângulos (Manual da Marca FMUSP, página 26). */
    :root { --yi: clamp(12px, 3.2vw, 28px); --quadro: min(100vw, 720px); }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #f1f6f3; color: #1f2a2e; font-size: 16px; line-height: 1.62;
      font-family: "FF Unit Slab", "FF Unit Slab Pro", "Unit Slab Pro", "Unit Slab OT", "Unit Slab Offc Pro",
                   "Lucida Sans", "Lucida Sans Unicode", "Lucida Grande", Verdana, "DejaVu Sans", sans-serif; }
    main { position: relative; overflow: hidden; width: var(--quadro); margin: 0 auto; background: #fff;
      padding: 40px 28px calc(var(--yi) + 0.405 * var(--quadro) + 40px); }
    .base { position: absolute; left: 50%; bottom: 0; width: 0; height: 0; }
    .tri { position: absolute; display: block; bottom: 0; width: 3000px; }
    .tri-escuro { right: calc(var(--yi) / -0.8098); height: calc(3000px * 0.8098); background: #006747;
      clip-path: polygon(0 0, 100% 100%, 0 100%); }
    .tri-agua { left: calc(var(--yi) / -0.4877); height: calc(3000px * 0.4877); background: #009ca6;
      clip-path: polygon(0 100%, 100% 0, 100% 100%); }
    .in { position: relative; z-index: 1; }
    .marca { display: block; width: clamp(150px, 40vw, 196px); margin: 0 auto 36px; }
    .marca img { display: block; width: 100%; height: auto; }
    .k { margin: 0 0 10px 0; font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #00737b; }
    h1 { font-size: 30px; line-height: 1.16; letter-spacing: -.01em; color: #006747; margin: 0 0 16px 0; }
    p { margin: 0 0 1em 0; }
    a { color: #006747; font-weight: 700; text-underline-offset: 3px; }
    .urg { margin-top: 26px; background: #fbe9ec; border-left: 5px solid #ba0c2f; padding: 16px 22px 16px 18px;
      clip-path: polygon(0 0, calc(100% - 45px) 0, 100% 22px, 100% 100%, 0 100%); }
    .urg b { color: #ba0c2f; }
    @media (min-width: 760px) {
      main { margin: 40px auto; padding-left: 48px; padding-right: 48px; box-shadow: 0 0 0 1px #d6dfda; }
      h1 { font-size: 34px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="base" aria-hidden="true"><span class="tri tri-agua"></span><span class="tri tri-escuro"></span></div>
    <div class="in">
      <a class="marca" href="https://www.fm.usp.br/"><img src="assets/marca-fmusp.png" alt="Faculdade de Medicina da USP" width="196" height="98"></a>
      <p class="k">GRAPAL</p>
      <h1>Página não encontrada</h1>
      <p>O endereço pode ter mudado. Volte à <a href="./">página do GRAPAL</a> ou escreva para
      <a href="mailto:grapal@usp.br">grapal@usp.br</a>.</p>
      <div class="urg"><b>Em urgência</b>, não espere: em dias úteis, das 8h às 17h, procure o pronto-atendimento do
      CeAC; à noite, nos fins de semana e feriados, a <span style="white-space:nowrap">UER-ICHC</span>. <a href="./#urgencia">Quando procurar</a></div>
    </div>
  </main>
</body>
</html>
